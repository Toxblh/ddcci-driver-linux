name: rpm
on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # ALT macros (%_unitdir, %systemd_post, ...) need an ALT userspace
    container:
      image: registry.altlinux.org/alt/alt:p11
    steps:
      - name: Install build deps
        run: |
          set -eu
          apt-get update -qq
          apt-get install -y -qq rpm-build git nodejs

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build source tarball and RPM
        run: |
          set -euo pipefail
          # rpmbuild refuses to run as root
          useradd -m builder
          chown -R builder: .
          ver="$(sed -n 's/^Version:[[:space:]]*//p' dkms-ddcci.spec | tr -d ' ')"
          git archive --format=tar --prefix="dkms-ddcci-${ver}/" HEAD > "dkms-ddcci-${ver}.tar"
          install -d -o builder -g builder /tmp/rpmbuild/SOURCES /tmp/rpmbuild/SPECS
          cp "dkms-ddcci-${ver}.tar" /tmp/rpmbuild/SOURCES/
          cp dkms-ddcci.spec /tmp/rpmbuild/SPECS/
          runuser -u builder -- rpmbuild -ba --define "_topdir /tmp/rpmbuild" /tmp/rpmbuild/SPECS/dkms-ddcci.spec
          mkdir -p out && cp -v /tmp/rpmbuild/RPMS/noarch/*.rpm /tmp/rpmbuild/SRPMS/*.src.rpm out/

      - name: Upload RPMs
        uses: actions/upload-artifact@v4
        with:
          name: rpms
          path: out/
